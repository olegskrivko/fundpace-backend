[project]
name = "backend"
version = "0.1.0"
description = "FundPace backend service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]
